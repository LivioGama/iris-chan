<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>VRM Avatar Viewer</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<style>
			body { margin: 0; overflow: hidden; background: transparent; }
			canvas { display: block; }

			/* Debug overlay */
			#debug-panel {
				position: fixed;
				bottom: 8px;
				right: 8px;
				pointer-events: none;
				font-family: 'SF Mono', 'Menlo', monospace;
				font-size: 10px;
				color: rgba(255,255,255,0.8);
				text-shadow: 0 1px 3px rgba(0,0,0,0.8);
				z-index: 9999;
				display: flex;
				flex-direction: column;
				align-items: flex-end;
				gap: 4px;
			}
			#debug-indicators {
				display: flex;
				gap: 6px;
				align-items: center;
			}
			.dbg-dot {
				display: flex;
				align-items: center;
				gap: 3px;
				opacity: 0.4;
				transition: opacity 0.15s;
			}
			.dbg-dot.active { opacity: 1; }
			.dbg-dot::before {
				content: '';
				width: 8px;
				height: 8px;
				border-radius: 50%;
				display: inline-block;
			}
			#dbg-mic::before { background: #4ade80; }
			#dbg-voice::before { background: #60a5fa; }
			#dbg-send::before { background: #facc15; }
			#dbg-think::before { background: #fb923c; }
			#dbg-think.active::before { animation: pulse 0.8s ease-in-out infinite; }
			#dbg-speak::before { background: #c084fc; }
			#dbg-ws::before { background: #f87171; }
			#dbg-tool::before { background: #22d3ee; }
			#dbg-tool.active::before { animation: pulse 0.6s ease-in-out infinite; }
			@keyframes pulse {
				0%, 100% { opacity: 1; }
				50% { opacity: 0.3; }
			}
			#dbg-status {
				font-size: 9px;
				opacity: 0.6;
			}
			/* Speech bubbles — right of avatar */
			#bubble-container {
				position: fixed;
				top: 8%;
				right: 4px;
				pointer-events: none;
				z-index: 9998;
				display: flex;
				flex-direction: column;
				align-items: flex-end;
				gap: 6px;
				max-width: 42%;
			}
			.bubble {
				padding: 8px 12px;
				border-radius: 12px;
				font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
				font-size: 12px;
				line-height: 1.4;
				word-wrap: break-word;
				max-width: 100%;
				opacity: 0;
				transform: translateY(6px) scale(0.95);
				transition: opacity 0.25s ease, transform 0.25s ease;
			}
			.bubble.visible {
				opacity: 1;
				transform: translateY(0) scale(1);
			}
			.bubble-user {
				background: rgba(59, 130, 246, 0.85);
				color: #fff;
				border-bottom-right-radius: 4px;
				align-self: flex-end;
			}
			.bubble-iris {
				background: rgba(255, 255, 255, 0.9);
				color: #1a1a1a;
				border-bottom-left-radius: 4px;
				align-self: flex-start;
				box-shadow: 0 1px 4px rgba(0,0,0,0.15);
			}
			.bubble-label {
				font-size: 9px;
				font-weight: 600;
				opacity: 0.6;
				margin-bottom: 1px;
			}
			.bubble-user .bubble-label { color: rgba(255,255,255,0.7); }
			.bubble-iris .bubble-label { color: #888; }
		</style>
	</head>

	<body>
		<!-- Debug overlay -->
		<div id="debug-panel">
			<div id="debug-indicators">
				<span id="dbg-ws" class="dbg-dot">WS</span>
				<span id="dbg-mic" class="dbg-dot">MIC</span>
				<span id="dbg-voice" class="dbg-dot">VOICE</span>
				<span id="dbg-send" class="dbg-dot">SEND</span>
				<span id="dbg-think" class="dbg-dot">THINK</span>
				<span id="dbg-speak" class="dbg-dot">SPEAK</span>
				<span id="dbg-tool" class="dbg-dot">TOOL</span>
			</div>
			<div id="dbg-status">Initializing...</div>
		</div>

		<!-- Speech bubbles -->
		<div id="bubble-container">
			<div id="bubble-user" class="bubble bubble-user">
				<div class="bubble-label">You</div>
				<div id="dbg-user-text"></div>
			</div>
			<div id="bubble-iris" class="bubble bubble-iris">
				<div class="bubble-label">Iris</div>
				<div id="dbg-model-text"></div>
			</div>
		</div>

		<!-- Import map: resolve bare specifiers to CDN URLs -->
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
					"@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js",
					"@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3/lib/three-vrm-animation.module.min.js"
				}
			}
		</script>

		<script type="module">
			import * as THREE from 'three';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
			import { createVRMAnimationClip, VRMAnimationLoaderPlugin } from '@pixiv/three-vrm-animation';

			// ── Renderer (WebGL2 → ANGLE → Metal on macOS) ─────────────
			const renderer = new THREE.WebGLRenderer({
				antialias: true,
				powerPreference: 'high-performance',
				alpha: true,
			});
			renderer.setClearColor(0x000000, 0);
			renderer.setSize(window.innerWidth, window.innerHeight);
			renderer.setPixelRatio(window.devicePixelRatio);
			renderer.outputColorSpace = THREE.SRGBColorSpace;
			document.body.appendChild(renderer.domElement);

			// ── Camera ─────────────────────────────────────────────────
			const camera = new THREE.PerspectiveCamera(30.0, window.innerWidth / window.innerHeight, 0.1, 20.0);
			camera.position.set(0.0, 1.05, 2.4);
			camera.lookAt(0.0, 1.05, 0.0);

			// ── Scene ──────────────────────────────────────────────────
			const scene = new THREE.Scene();

			// ── Lighting ───────────────────────────────────────────────
			const dirLight = new THREE.DirectionalLight(0xffffff, Math.PI);
			dirLight.position.set(1.0, 1.0, 1.0).normalize();
			scene.add(dirLight);

			// ── Loader with both VRM + VRM Animation plugins ───────────
			const loader = new GLTFLoader();
			loader.crossOrigin = 'anonymous';
			loader.register((parser) => new VRMLoaderPlugin(parser));
			loader.register((parser) => new VRMAnimationLoaderPlugin(parser));

			const [gltfVrm, gltfVrma] = await Promise.all([
				loader.loadAsync('./avatar.glb'),
				loader.loadAsync('./idle_loop.vrma'),
			]);

			const vrm = gltfVrm.userData.vrm;
			VRMUtils.removeUnnecessaryVertices(gltfVrm.scene);
			VRMUtils.combineSkeletons(gltfVrm.scene);
			VRMUtils.combineMorphs(vrm);
			vrm.scene.traverse((obj) => { obj.frustumCulled = false; });
			vrm.scene.rotation.y = Math.PI;

			for (let i = 0; i < 60; i++) vrm.update(1 / 60);
			scene.add(vrm.scene);

			const clip = createVRMAnimationClip(gltfVrma.userData.vrmAnimations[0], vrm);
			const mixer = new THREE.AnimationMixer(vrm.scene);
			mixer.clipAction(clip).setLoop(THREE.LoopRepeat).play();

			// ── Procedural overlays (head, fingers, expressions) ───────
			function applyOverlays(vrm, time) {
				const h = vrm.humanoid;
				if (!h) return;

				// Head — look around (VRMA has neck but no head track)
				const head = h.getNormalizedBoneNode('head');
				if (head) {
					head.rotation.y = Math.sin(time * 0.3) * 0.12 + Math.sin(time * 0.13) * 0.06;
					head.rotation.x = Math.sin(time * 0.5) * 0.05;
					head.rotation.z = Math.sin(time * 0.4 + 1.0) * 0.04;
				}

				// Fingers — relaxed curl with gentle movement
				const curl = 0.2 + Math.sin(time * 0.35) * 0.08;
				for (const side of ['right', 'left']) {
					const sign = side === 'right' ? -1 : 1;
					for (const finger of ['Index', 'Middle', 'Ring', 'Little']) {
						const prox = h.getNormalizedBoneNode(`${side}${finger}Proximal`);
						const inter = h.getNormalizedBoneNode(`${side}${finger}Intermediate`);
						const dist = h.getNormalizedBoneNode(`${side}${finger}Distal`);
						const offset = { Index: 0, Middle: 0.15, Ring: 0.3, Little: 0.45 }[finger];
						const fc = curl + Math.sin(time * 0.4 + offset) * 0.05;
						if (prox) prox.rotation.z = sign * fc;
						if (inter) inter.rotation.z = sign * fc * 1.1;
						if (dist) dist.rotation.z = sign * fc * 0.8;
					}
					const tMeta = h.getNormalizedBoneNode(`${side}ThumbMetacarpal`);
					const tProx = h.getNormalizedBoneNode(`${side}ThumbProximal`);
					const tDist = h.getNormalizedBoneNode(`${side}ThumbDistal`);
					if (tMeta) tMeta.rotation.z = sign * 0.15;
					if (tProx) tProx.rotation.z = sign * (0.1 + Math.sin(time * 0.3) * 0.05);
					if (tDist) tDist.rotation.z = sign * 0.1;
				}

				// Expressions
				const expr = vrm.expressionManager;
				if (expr) {
					const blinkInterval = 6.0 + Math.sin(time * 0.13) * 2.0;
					const blinkPhase = time % blinkInterval;
					let blinkVal = 0;
					if (blinkPhase < 0.12) {
						blinkVal = Math.sin((blinkPhase / 0.12) * Math.PI);
					}
					expr.setValue('blink', blinkVal);

					// Lip sync — drive mouth from playback volume
					const vol = window._voicePipeline?.getSpeakingVolume() || 0;
					if (vol > 0.01) {
						const open = Math.min(1, vol * 4);
						expr.setValue('aa', open * 0.7);
						expr.setValue('oh', open * 0.3);
						expr.setValue('happy', 0.15);
					} else {
						expr.setValue('aa', 0);
						expr.setValue('oh', 0);
						const smileVal = Math.max(0, Math.sin(time * 0.2) * 0.3);
						expr.setValue('happy', smileVal);
					}
				}
			}

			// ── Handle window resize ───────────────────────────────────
			window.addEventListener('resize', () => {
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize(window.innerWidth, window.innerHeight);
			});

			// ── Render loop ────────────────────────────────────────────
			const clock = new THREE.Clock();
			let elapsedTime = 0;

			function animate() {
				requestAnimationFrame(animate);
				const delta = clock.getDelta();
				elapsedTime += delta;

				mixer.update(delta);
				applyOverlays(vrm, elapsedTime);
				vrm.update(delta);

				renderer.render(scene, camera);
			}

			animate();

			// ── Voice pipeline ────────────────────────────────────────
			import { VoicePipeline } from './voice-pipeline.js';
			const voice = new VoicePipeline();
			window._voicePipeline = voice;
			voice.start().catch(err => console.error('[Voice] Start error:', err));
		</script>
	</body>
</html>
