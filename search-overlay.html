<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			background: transparent;
			overflow: hidden;
			font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
		}
		html, body { height: 100%; }
		#container {
			position: fixed;
			inset: 12px;
			background: rgba(12, 12, 18, 0.92);
			backdrop-filter: blur(24px);
			-webkit-backdrop-filter: blur(24px);
			border-radius: 14px;
			border: 1px solid rgba(255,255,255,0.08);
			box-shadow: 0 8px 40px rgba(0,0,0,0.5);
			display: flex;
			flex-direction: column;
			min-height: 0;
			opacity: 0;
			transform: scale(0.96);
			transition: opacity 0.3s ease, transform 0.3s ease;
		}
		#container.visible {
			opacity: 1;
			transform: scale(1);
		}
		#header {
			padding: 12px 16px 8px;
			border-bottom: 1px solid rgba(255,255,255,0.06);
			display: flex;
			align-items: center;
			gap: 8px;
			flex-shrink: 0;
		}
		#close-btn {
			width: 20px;
			height: 20px;
			border: none;
			background: rgba(255,255,255,0.06);
			color: rgba(255,255,255,0.4);
			border-radius: 5px;
			font-size: 13px;
			line-height: 20px;
			text-align: center;
			cursor: pointer;
			flex-shrink: 0;
			transition: background 0.15s, color 0.15s;
			padding: 0;
		}
		#close-btn:hover {
			background: rgba(255,255,255,0.12);
			color: rgba(255,255,255,0.8);
		}
		#search-icon {
			width: 14px;
			height: 14px;
			border: 2px solid rgba(160, 140, 255, 0.7);
			border-radius: 50%;
			position: relative;
			flex-shrink: 0;
		}
		#search-icon::after {
			content: '';
			position: absolute;
			width: 6px;
			height: 2px;
			background: rgba(160, 140, 255, 0.7);
			bottom: -4px;
			right: -5px;
			transform: rotate(45deg);
			border-radius: 1px;
		}
		#query {
			font-size: 12px;
			font-weight: 600;
			color: rgba(255,255,255,0.5);
			letter-spacing: 0.3px;
			flex: 1;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		#content {
			flex: 1;
			min-height: 0;
			overflow-y: scroll;
			padding: 14px 16px;
			font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
			font-size: 12px;
			line-height: 1.65;
			color: rgba(255,255,255,0.88);
			word-wrap: break-word;
			scrollbar-width: thin;
			scrollbar-color: rgba(255,255,255,0.15) transparent;
		}
		#content::-webkit-scrollbar { width: 5px; }
		#content::-webkit-scrollbar-track { background: transparent; }
		#content::-webkit-scrollbar-thumb {
			background: rgba(255,255,255,0.15);
			border-radius: 3px;
		}
		#content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
		/* Markdown styles */
		#content h1, #content h2, #content h3 {
			color: rgba(255,255,255,0.95);
			margin: 10px 0 4px;
			font-weight: 600;
		}
		#content h1 { font-size: 15px; }
		#content h2 { font-size: 13px; }
		#content h3 { font-size: 12px; }
		#content p { margin: 0 0 8px; }
		#content ul, #content ol {
			margin: 0 0 8px;
			padding-left: 18px;
		}
		#content li { margin-bottom: 3px; }
		#content a {
			color: #818cf8;
			text-decoration: none;
		}
		#content code {
			font-family: 'SF Mono', 'Menlo', monospace;
			font-size: 11px;
			background: rgba(255,255,255,0.07);
			padding: 1px 5px;
			border-radius: 3px;
		}
		#content pre {
			background: rgba(255,255,255,0.05);
			padding: 8px 10px;
			border-radius: 6px;
			margin: 4px 0 8px;
			overflow-x: auto;
		}
		#content pre code { background: none; padding: 0; }
		#content strong { color: rgba(255,255,255,0.95); }
		#content hr {
			border: none;
			border-top: 1px solid rgba(255,255,255,0.08);
			margin: 8px 0;
		}
		#content blockquote {
			border-left: 2px solid rgba(160,140,255,0.4);
			padding-left: 10px;
			margin: 4px 0 8px;
			color: rgba(255,255,255,0.6);
		}
		#spinner {
			display: none;
			padding: 40px;
			text-align: center;
		}
		#spinner.active { display: block; }
		#spinner-dots {
			font-size: 13px;
			color: rgba(160, 140, 255, 0.6);
			font-family: 'SF Mono', monospace;
		}
		@keyframes dots {
			0% { content: ''; }
			25% { content: '.'; }
			50% { content: '..'; }
			75% { content: '...'; }
		}
		#spinner-dots::after {
			content: '';
			animation: dots 1.2s steps(1) infinite;
		}
	</style>
</head>
<body>
	<div id="container">
		<div id="header">
			<div id="search-icon"></div>
			<div id="query"></div>
			<button id="close-btn">&times;</button>
		</div>
		<div id="spinner">
			<span id="spinner-dots">searching</span>
		</div>
		<div id="content"></div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
	<script>
		const { ipcRenderer } = require('electron');

		const container = document.getElementById('container');
		const queryEl = document.getElementById('query');
		const contentEl = document.getElementById('content');
		const spinner = document.getElementById('spinner');

		function renderMarkdown(text) {
			try {
				return marked.parse(text || '', { breaks: true });
			} catch {
				return text.replace(/</g, '&lt;').replace(/\n/g, '<br>');
			}
		}

		requestAnimationFrame(() => {
			requestAnimationFrame(() => {
				container.classList.add('visible');
			});
		});

		ipcRenderer.on('search-spinner', (_, query) => {
			queryEl.textContent = query;
			contentEl.innerHTML = '';
			spinner.classList.add('active');
		});

		ipcRenderer.on('search-result', (_, query, content) => {
			queryEl.textContent = query;
			contentEl.innerHTML = renderMarkdown(content);
			spinner.classList.remove('active');
			contentEl.scrollTop = 0;
		});

		ipcRenderer.on('search-hide', () => {
			container.classList.remove('visible');
		});

		function dismiss() {
			ipcRenderer.send('search-hide');
		}

		document.getElementById('close-btn').addEventListener('click', dismiss);
		document.addEventListener('keydown', (e) => {
			if (e.key === 'Escape') dismiss();
		});
	</script>
</body>
</html>
