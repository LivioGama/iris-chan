<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Iris-chan</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
		<link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin />
		<link rel="stylesheet" href="./styles/overlay.css" />
	</head>
	<body>
		<div id="mute-badge">MUTED</div>
		<div id="auto-badge">AUTO</div>
		<div id="workspace-bar"></div>
		<div id="debug-panel">
			<div id="debug-indicators">
				<span id="dbg-ws" class="dbg-dot">WS</span>
				<span id="dbg-mic" class="dbg-dot">MIC</span>
				<span id="dbg-voice" class="dbg-dot">VOICE</span>
				<span id="dbg-send" class="dbg-dot">SEND</span>
				<span id="dbg-think" class="dbg-dot">THINK</span>
				<span id="dbg-speak" class="dbg-dot">SPEAK</span>
				<span id="dbg-tool" class="dbg-dot">TOOL</span>
				<span id="dbg-srch" class="dbg-dot">SRCH</span>
				<span id="dbg-auto" class="dbg-dot">AUTO</span>
			</div>
			<div id="dbg-status">Initializing...</div>
		</div>
		<div id="bubbles"></div>
		<div id="activity-timeline" aria-live="polite" aria-label="Task updates"></div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
					"@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js",
					"@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3/lib/three-vrm-animation.module.min.js"
				}
			}
		</script>
		<script type="module" src="app.js"></script>
	</body>
</html>
