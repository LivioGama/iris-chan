<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>VRM Avatar Viewer</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="styles/overlay.css" />
	</head>

	<body>
		<!-- Workspace indicator -->
		<div id="workspace-bar"></div>

		<!-- Debug overlay -->
		<div id="debug-panel">
			<div id="debug-indicators">
				<span id="dbg-ws" class="dbg-dot">WS</span>
				<span id="dbg-mic" class="dbg-dot">MIC</span>
				<span id="dbg-voice" class="dbg-dot">VOICE</span>
				<span id="dbg-send" class="dbg-dot">SEND</span>
				<span id="dbg-think" class="dbg-dot">THINK</span>
				<span id="dbg-speak" class="dbg-dot">SPEAK</span>
				<span id="dbg-tool" class="dbg-dot">TOOL</span>
				<span id="dbg-srch" class="dbg-dot">SRCH</span>
			</div>
			<div id="dbg-status">Initializing...</div>
		</div>

		<!-- Speech bubbles -->
		<div id="bubble-container">
			<div id="bubble-user" class="bubble bubble-user">
				<div class="bubble-label">You</div>
				<div id="dbg-user-text"></div>
			</div>
			<div id="bubble-iris" class="bubble bubble-iris">
				<div class="bubble-label">Iris</div>
				<div id="dbg-model-text"></div>
			</div>
		</div>

		<!-- Import map: resolve bare specifiers to CDN URLs -->
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
					"@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js",
					"@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3/lib/three-vrm-animation.module.min.js"
				}
			}
		</script>

		<script type="module" src="app.js"></script>
	</body>
</html>
