<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Kanban Board</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
			background: transparent;
			overflow: hidden;
			-webkit-app-region: drag;
			user-select: none;
		}

		.shell {
			border-radius: 12px;
			overflow: hidden;
			height: 100vh;
			display: flex;
			flex-direction: column;
			background: rgba(20, 20, 24, 0.78);
			backdrop-filter: blur(50px) saturate(160%);
			-webkit-backdrop-filter: blur(50px) saturate(160%);
			border: 0.5px solid rgba(255, 255, 255, 0.08);
		}

		/* ── Header ── */
		.header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 7px 12px;
			border-bottom: 0.5px solid rgba(255, 255, 255, 0.06);
			-webkit-app-region: drag;
			flex-shrink: 0;
		}

		.header-left h3 {
			font-size: 12px;
			font-weight: 600;
			color: rgba(255, 255, 255, 0.7);
			letter-spacing: -0.1px;
		}

		.header .actions {
			display: flex;
			gap: 6px;
			-webkit-app-region: no-drag;
		}

		/* ── Buttons ── */
		button {
			padding: 3px 10px;
			border: none;
			border-radius: 5px;
			font-weight: 500;
			font-size: 11px;
			cursor: pointer;
			transition: all 0.12s ease;
			-webkit-app-region: no-drag;
			outline: none;
		}
		button:active { transform: scale(0.96); }

		.btn-primary {
			background: rgba(99, 102, 241, 0.7);
			color: rgba(255, 255, 255, 0.95);
		}
		.btn-primary:hover { background: rgba(99, 102, 241, 0.85); }

		.btn-secondary {
			background: rgba(255, 255, 255, 0.06);
			color: rgba(255, 255, 255, 0.5);
			border: 0.5px solid rgba(255, 255, 255, 0.06);
		}
		.btn-secondary:hover {
			background: rgba(255, 255, 255, 0.1);
			color: rgba(255, 255, 255, 0.7);
		}

		/* ── Board ── */
		.board {
			display: flex;
			flex: 1;
			gap: 1px;
			padding: 6px;
			overflow: hidden;
			-webkit-app-region: no-drag;
		}

		/* ── Columns ── */
		.column {
			flex: 1;
			display: flex;
			flex-direction: column;
			min-width: 0;
			border-radius: 8px;
			background: rgba(255, 255, 255, 0.02);
			padding: 6px;
		}

		.column-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 4px 8px;
			margin-bottom: 6px;
			border-radius: 5px;
			flex-shrink: 0;
		}

		.column-header .label {
			font-size: 10px;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.4px;
		}

		.column-header .count {
			font-size: 9px;
			font-weight: 600;
			min-width: 16px;
			height: 16px;
			display: flex;
			align-items: center;
			justify-content: center;
			border-radius: 8px;
		}

		.column-clean-btn {
			background: none;
			border: none;
			padding: 2px 4px;
			font-size: 10px;
			cursor: pointer;
			color: rgba(255, 255, 255, 0.3);
			opacity: 0;
			transition: opacity 0.2s ease;
		}
		.column-header:hover .column-clean-btn {
			opacity: 1;
		}
		.column-clean-btn:hover {
			color: rgba(248, 113, 113, 0.8);
		}

		/* Column visibility & animation */
		.board {
			transition: width 0.3s ease;
		}
		.column {
			transition: flex 0.3s ease, opacity 0.3s ease;
		}
		.column.hidden {
			flex: 0;
			opacity: 0;
			overflow: hidden;
			padding: 0;
			min-width: 0;
		}

		/* Status colors — dark mode */
		.col-todo .column-header { background: rgba(129, 140, 248, 0.1); }
		.col-todo .column-header .label { color: rgba(165, 170, 255, 0.85); }
		.col-todo .column-header .count { background: rgba(129, 140, 248, 0.15); color: rgba(165, 170, 255, 0.8); }

		.col-progress .column-header { background: rgba(251, 191, 36, 0.08); }
		.col-progress .column-header .label { color: rgba(251, 191, 36, 0.85); }
		.col-progress .column-header .count { background: rgba(251, 191, 36, 0.12); color: rgba(251, 191, 36, 0.8); }

		.col-done .column-header { background: rgba(52, 211, 153, 0.08); }
		.col-done .column-header .label { color: rgba(110, 231, 183, 0.85); }
		.col-done .column-header .count { background: rgba(52, 211, 153, 0.12); color: rgba(110, 231, 183, 0.8); }

		.tasks {
			flex: 1;
			overflow-y: auto;
			overflow-x: hidden;
			padding: 1px;
		}

		/* ── Task Cards ── */
		.task {
			background: rgba(255, 255, 255, 0.04);
			border: 0.5px solid rgba(255, 255, 255, 0.06);
			border-radius: 6px;
			padding: 6px 8px;
			margin-bottom: 3px;
			transition: background 0.15s ease;
			cursor: grab;
		}

		.task:hover {
			background: rgba(255, 255, 255, 0.07);
		}

		.task.dragging {
			opacity: 0.3;
		}

		.column.drag-over {
			background: rgba(129, 140, 248, 0.06);
			outline: 1.5px dashed rgba(129, 140, 248, 0.2);
			outline-offset: -1.5px;
		}

		.task .title {
			font-weight: 400;
			font-size: 11px;
			color: rgba(255, 255, 255, 0.78);
			margin-bottom: 4px;
			line-height: 1.3;
		}

		.task-status {
			display: inline-flex;
			align-items: center;
			margin-bottom: 5px;
			padding: 2px 6px;
			border-radius: 999px;
			font-size: 9px;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.4px;
			background: rgba(255, 255, 255, 0.08);
			color: rgba(255, 255, 255, 0.6);
		}

		.task .task-actions {
			display: flex;
			gap: 4px;
			align-items: center;
		}

		.task .task-actions button {
			padding: 2px 7px;
			font-size: 10px;
			border-radius: 4px;
			font-weight: 500;
		}

		.start-btn {
			background: rgba(129, 140, 248, 0.1);
			color: rgba(165, 170, 255, 0.8);
			border: 0.5px solid rgba(129, 140, 248, 0.12);
		}
		.start-btn:hover { background: rgba(129, 140, 248, 0.18); }

		.finish-btn {
			background: rgba(52, 211, 153, 0.15);
			color: rgba(110, 231, 183, 0.95);
			border: 0.5px solid rgba(52, 211, 153, 0.2);
			font-weight: 600;
		}
		.finish-btn:hover { background: rgba(52, 211, 153, 0.25); }

		.run-btn {
			background: rgba(251, 191, 36, 0.1);
			color: rgba(251, 191, 36, 0.9);
			border: 0.5px solid rgba(251, 191, 36, 0.12);
		}
		.run-btn:hover { background: rgba(251, 191, 36, 0.18); }

		.delete-btn {
			background: none;
			color: rgba(255, 255, 255, 0.15);
			border: none;
			padding: 2px 4px;
			margin-left: auto;
			font-size: 12px;
			line-height: 1;
		}
		.delete-btn:hover { color: rgba(248, 113, 113, 0.8); }

		/* ── Empty state ── */
		.empty-state {
			text-align: center;
			padding: 12px 6px;
			color: rgba(255, 255, 255, 0.15);
			font-size: 10px;
		}

		/* ── Inline input ── */
		.add-inline { margin-top: 4px; }
		.add-inline input {
			width: 100%;
			padding: 5px 7px;
			border: 0.5px solid rgba(255, 255, 255, 0.06);
			border-radius: 5px;
			font-size: 10px;
			font-family: inherit;
			background: rgba(255, 255, 255, 0.03);
			outline: none;
			color: rgba(255, 255, 255, 0.8);
			transition: all 0.12s ease;
		}
		.add-inline input:focus {
			border-color: rgba(129, 140, 248, 0.35);
			box-shadow: 0 0 0 2px rgba(129, 140, 248, 0.08);
			background: rgba(255, 255, 255, 0.05);
		}
		.add-inline input::placeholder { color: rgba(255, 255, 255, 0.2); }

		/* ── Scrollbar ── */
		::-webkit-scrollbar { width: 3px; }
		::-webkit-scrollbar-track { background: transparent; }
		::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 2px; }
		::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.15); }

		/* ── Animations ── */
		@keyframes fadeIn {
			from { opacity: 0; transform: translateY(3px); }
			to { opacity: 1; transform: translateY(0); }
		}
		.task { animation: fadeIn 0.15s ease; }

		.task-done .title {
			text-decoration: line-through;
			color: rgba(255, 255, 255, 0.25);
		}

		/* ── Task Logs Display ── */
		.task-logs {
			margin-top: 6px;
			padding: 6px;
			background: rgba(0, 0, 0, 0.3);
			border-radius: 4px;
			font-family: 'Monaco', 'Courier New', monospace;
			font-size: 9px;
			color: rgba(165, 170, 255, 0.7);
			line-height: 1.4;
			max-height: 120px;
			overflow-y: auto;
			white-space: pre-wrap;
			word-break: break-word;
			border-left: 2px solid rgba(251, 191, 36, 0.3);
		}

		.task-done .task-logs {
			max-height: 60px;
			border-left-color: rgba(52, 211, 153, 0.3);
			color: rgba(110, 231, 183, 0.5);
		}

		.task-logs.empty {
			display: none;
		}

		/* ── Loading Indicator Animation ── */
	@keyframes pulse {
		0%, 100% { opacity: 1; }
		50% { opacity: 0.6; }
	}

	@keyframes spin {
		0% { transform: rotate(0deg); }
		100% { transform: rotate(360deg); }
	}

	.loading-indicator {
		animation: pulse 1.5s ease-in-out infinite;
	}

	.spinning {
		display: inline-block;
		animation: spin 1s linear infinite;
	}
	</style>
</head>
<body>
	<div class="shell">
		<div class="header">
			<div class="header-left">
				<h3>Kanban</h3>
			</div>
			<div class="actions">
				<button class="btn-secondary" id="commit-push-btn" title="Commit and push to git">
					📝 Commit & Push
				</button>
				<button class="btn-secondary" id="reorganize-btn" title="AI-reorganize all tasks">
					🔄 Reorganize
				</button>
				<button class="btn-secondary" id="clean-tasks" title="Remove completed tasks">
					🗑️ Clean
				</button>
				<button class="btn-secondary" id="run-all">
					<svg width="10" height="10" viewBox="0 0 10 10" fill="none" style="vertical-align: -1px; margin-right: 3px;">
						<path d="M2 1.5L8 5L2 8.5V1.5Z" fill="currentColor"/>
					</svg>
					Run All
				</button>
				<button class="btn-primary" id="add-task">+ New</button>
			</div>
		</div>

		<div class="board">
			<div class="column col-todo" data-status="TODO">
				<div class="column-header">
					<span class="label">To Do</span>
					<span class="count" id="todo-count">0</span>
				</div>
				<div class="tasks" id="todo-tasks"></div>
				<div class="add-inline">
					<input type="text" placeholder="Add a task..." id="todo-input" />
				</div>
			</div>
			<div class="column col-progress" data-status="IN_PROGRESS">
				<div class="column-header">
					<span class="label">In Progress</span>
					<span class="count" id="progress-count">0</span>
				</div>
				<div class="tasks" id="in-progress-tasks"></div>
			</div>
			<div class="column col-done" data-status="DONE">
				<div class="column-header">
					<span class="label">Done</span>
					<span class="count" id="done-count">0</span>
					<button id="clean-done-btn" class="column-clean-btn" title="Remove all done tasks">🗑️</button>
				</div>
				<div class="tasks" id="done-tasks"></div>
			</div>
		</div>
	</div>

	<script>
		let tasks = [];
		let taskIdCounter = 1;
		let draggedTask = null;
		let reloadTimeout = null;
		let renderTimeout = null;
		const activelyStreamingTasks = new Set();
		const sdkRunningTasks = new Set();
		const recentlyCompletedTasks = new Map();
		const dismissedQueueTaskIds = loadDismissedQueueTaskIds();

		function loadDismissedQueueTaskIds() {
			try {
				const saved = localStorage.getItem('dismissed-queue-tasks');
				return new Set(saved ? JSON.parse(saved) : []);
			} catch {
				return new Set();
			}
		}

		function persistDismissedQueueTaskIds() {
			try {
				localStorage.setItem('dismissed-queue-tasks', JSON.stringify([...dismissedQueueTaskIds]));
			} catch {}
		}

		function mapTaskStatus(status) {
			const s = String(status || '').toLowerCase();
			if (['completed', 'done', 'success'].includes(s)) return 'DONE';
			if (['running', 'resuming', 'active', 'in_progress', 'started'].includes(s)) return 'IN_PROGRESS';
			return 'TODO';
		}

		function getStatusBadge(task) {
			const status = task.status;
			const normalized = mapTaskStatus(status);
			if (normalized === 'DONE') return '✓';
			if (normalized === 'IN_PROGRESS') return '●';
			return '○';
		}

		function scheduleReload() {
			clearTimeout(reloadTimeout);
			reloadTimeout = setTimeout(loadTasks, 500);
		}

		function scheduleRender() {
			clearTimeout(renderTimeout);
			renderTimeout = setTimeout(renderTasks, 50);
		}

		let resizeTimeout = null;
		function updateWindowSize() {
			clearTimeout(resizeTimeout);
			resizeTimeout = setTimeout(() => {
				const totalTasks = tasks.length;
				const progressCol = document.querySelector('.col-progress');
				const doneCol = document.querySelector('.col-done');

				const hasWip = !progressCol.classList.contains('hidden');
				const hasDone = !doneCol.classList.contains('hidden');

				let width = 360; // 1 column
				if (hasWip && hasDone) width = 1000;
				else if (hasWip || hasDone) width = 720;

				const wipCount = countByStatus('IN_PROGRESS');
				const maxPerColumn = Math.max(
					tasks.filter(t => mapTaskStatus(t.status) === 'TODO').length,
					tasks.filter(t => mapTaskStatus(t.status) === 'IN_PROGRESS').length,
					tasks.filter(t => mapTaskStatus(t.status) === 'DONE').length
				);

				const logsExtra = wipCount * 110;
				const height = Math.min(38 + 30 + maxPerColumn * 35 + logsExtra + 30 + 24, 700);

				window.electronAPI?.kanbanResize(width, height);
			}, 100);
		}

		async function loadTasks() {
			try {
				const loaded = await window.electronAPI?.loadKanbanTasks() || [];
				tasks = Array.isArray(loaded) ? loaded : [];
				updateWindowSize();
				renderTasks();
			} catch {}
		}

		function countByStatus(status) {
			return tasks.filter((task) => mapTaskStatus(task.status) === status).length;
		}

		function updateCounts() {
			document.getElementById('todo-count').textContent = String(countByStatus('TODO'));
			document.getElementById('progress-count').textContent = String(countByStatus('IN_PROGRESS'));
			document.getElementById('done-count').textContent = String(countByStatus('DONE'));

			const progressCol = document.querySelector('.col-progress');
			const doneCol = document.querySelector('.col-done');
			const wipCount = countByStatus('IN_PROGRESS');
			const doneCount = countByStatus('DONE');

			progressCol.classList.toggle('hidden', wipCount === 0);
			doneCol.classList.toggle('hidden', doneCount === 0);
			updateWindowSize();
		}

		function renderTasks() {
			const columns = {
				TODO: document.getElementById('todo-tasks'),
				IN_PROGRESS: document.getElementById('in-progress-tasks'),
				DONE: document.getElementById('done-tasks'),
			};

			Object.values(columns).forEach(c => c.innerHTML = '');

			tasks.forEach((task) => {
				const status = mapTaskStatus(task.status);
				const container = columns[status];
				if (!container) return;

				const taskEl = document.createElement('div');
				taskEl.className = 'task' + (status === 'DONE' ? ' task-done' : '');
				taskEl.dataset.taskId = task.id;
				taskEl.title = task.description || '';

				const badge = document.createElement('div');
				badge.className = 'task-status';
				badge.textContent = getStatusBadge(task);
				taskEl.appendChild(badge);

				const title = document.createElement('div');
				title.className = 'title';
				title.textContent = task.title;
				taskEl.appendChild(title);

				const actions = document.createElement('div');
				actions.className = 'task-actions';

				if (status === 'TODO') {
					const runBtn = document.createElement('button');
					runBtn.className = 'run-btn';
					runBtn.textContent = '▶ Run';
					runBtn.onclick = async () => {
						runBtn.disabled = true;
						await window.electronAPI?.kanban.runTask(task.id);
					};
					actions.appendChild(runBtn);
				}

				const delBtn = document.createElement('button');
				delBtn.className = 'delete-btn';
				delBtn.innerHTML = '&times;';
				delBtn.onclick = async () => {
					await window.electronAPI?.kanban.deleteTask(task.id, task.source);
				};
				actions.appendChild(delBtn);


				taskEl.appendChild(actions);

				if (task.logs) {
					const logs = document.createElement('div');
					logs.className = 'task-logs';
					logs.textContent = task.logs;
					taskEl.appendChild(logs);
				}

				container.appendChild(taskEl);
			});

			updateCounts();
		}

		// Initial load
		async function addNewTask(title, description = '') {
			if (!title) return;
			const task = {
				title,
				description,
				status: 'queued',
				createdAt: new Date().toISOString()
			};
			await window.electronAPI?.kanban.addTask(task);
		}

		document.getElementById('add-task').onclick = () => {
			const title = prompt('Task title:');
			if (title) addNewTask(title);
		};

		document.getElementById('todo-input').onkeydown = async (e) => {
			if (e.key === 'Enter') {
				const title = e.target.value.trim();
				if (title) {
					e.target.value = '';
					await addNewTask(title);
				}
			}
		};

		document.getElementById('commit-push-btn').onclick = async () => {
			const msg = prompt('Commit message:');
			if (msg) {
				await window.electronAPI?.kanban.gitCommit(msg);
				await window.electronAPI?.kanban.gitPush();
			}
		};

		document.getElementById('clean-tasks').onclick = async () => {
			await window.electronAPI?.kanban.removeCompleted();
		};

		document.getElementById('clean-done-btn').onclick = async () => {
			await window.electronAPI?.kanban.removeCompleted();
		};

		loadTasks();

		if (window.electronAPI) {
			window.electronAPI.kanban.onTasksUpdated(() => loadTasks());

			window.electronAPI.queue.onTaskUpdate(() => loadTasks());

			window.electronAPI.onClaudeCodeStream((data) => {

				if (data.type === 'log' && data.taskId) {
					const task = tasks.find(t => t.id === data.taskId);
					if (task) {
						task.logs = (task.logs || '') + data.line + '\n';
						renderTasks();
					}
				} else if (data.type === 'done') {
					loadTasks();
				}
			});
		}
	</script>
</body>
</html>
