<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Overlay Bubble Harness</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="../../src/renderer/styles/overlay.css" />
		<style>
			body {
				background:
					radial-gradient(circle at top, rgba(125, 211, 252, 0.15), transparent 35%),
					linear-gradient(180deg, #08111d, #101b2a);
				min-height: 100vh;
			}
			.harness-controls {
				position: fixed;
				left: 12px;
				top: 12px;
				display: flex;
				gap: 8px;
				z-index: 10020;
			}
			button {
				background: rgba(255, 255, 255, 0.08);
				color: white;
				border: 1px solid rgba(255, 255, 255, 0.14);
				border-radius: 999px;
				padding: 8px 12px;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<div id="bubbles"></div>
		<div class="harness-controls">
			<button id="thinking-btn">Thinking</button>
			<button id="context-btn">Context</button>
			<button id="replying-btn">Reply</button>
			<button id="clear-btn">Clear</button>
		</div>

		<script type="module">
			import { showBubble, clearBubbles } from '../../src/renderer/ui/bubbles.js';

			document.getElementById('thinking-btn').addEventListener('click', () => {
				showBubble('thinking', 'Working out the next response.');
			});

			document.getElementById('context-btn').addEventListener('click', () => {
				showBubble('context', 'Checking recent tool output before the next edit.');
			});

			document.getElementById('replying-btn').addEventListener('click', () => {
				showBubble('chat', 'That cleanup is in place and the overlay is calmer now.', { role: 'iris' });
			});

			document.getElementById('clear-btn').addEventListener('click', () => {
				clearBubbles();
			});

			showBubble('thinking', 'Working out the next response.');
			setTimeout(() => {
				showBubble('context', 'Step 1 of 1 · Searching the web for the next clue.');
			}, 700);
		</script>
	</body>
</html>
